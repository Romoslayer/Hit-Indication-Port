plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
	archivesName = "${archives_base_name}-neoforge"
}

def neoForgeVersion = project.property("mc_${mcKey}_neoforge")
// "21.1.255" -> "[21.1,21.2)": NeoForge's own version range for this Minecraft version.
def neoParts = neoForgeVersion.tokenize('.')
def neoForgeRange = "[${neoParts[0]}.${neoParts[1]},${neoParts[0]}.${(neoParts[1] as int) + 1})"

neoForge {
	version = neoForgeVersion

	runs {
		configureEach {
			gameDirectory = file('run')
		}
		client {
			client()
		}
		server {
			server()
			programArguments = ['--nogui']
		}
	}

	mods {
		hitindication {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	def version = project.version
	def minecraft = minecraftVersion
	def mcRange = minecraftRange
	inputs.property 'version', version
	inputs.property 'minecraft', minecraft
	inputs.property 'minecraftRange', mcRange
	inputs.property 'neoForgeRange', neoForgeRange

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': version, 'minecraft': minecraft, 'minecraftRange': mcRange, 'neoForgeRange': neoForgeRange
	}
}
