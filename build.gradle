// Root project: holds only the settings the loader modules share. The mod itself is built by
// :fabric, :neoforge and :forge, each of which compiles the shared sources in common/ against its
// own Minecraft dependency.

subprojects {
	apply plugin: 'java'

	// The Minecraft version this branch targets (1.21.1; 26.2 and 26.3 are built from main).
	ext.minecraftVersion = project.findProperty('mc') ?: '1.21.1'
	ext.mcKey = ext.minecraftVersion.replace('.', '_')
	ext.modVersion = "${project.mod_version}+${ext.minecraftVersion}"
	ext.modJavaVersion = (project.java_version as String).toInteger()

	// "1.21.1" -> "[1.21.1,1.21.2)": 1.21.2 changed much of the code this build is compiled
	// against, so a build never claims to support it.
	def parts = ext.minecraftVersion.tokenize('.')
	ext.minecraftRange = "[${ext.minecraftVersion},${parts[0]}.${parts[1]}.${(parts[2] as int) + 1})"

	version = ext.modVersion
	group = project.maven_group

	// Every loader compiles the same shared sources.
	sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
	sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

	// Unit tests for the logic that needs no running game. Shared tests run once per loader.
	sourceSets.test.java.srcDir rootProject.file('common/src/test/java')

	repositories {
		mavenCentral()
	}

	dependencies {
		// Minecraft 1.21.1 does not ship JSpecify (26.x does); the annotations are compile-time only.
		compileOnly 'org.jspecify:jspecify:1.0.0'
		testCompileOnly 'org.jspecify:jspecify:1.0.0'

		testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
	}

	tasks.named('test') {
		useJUnitPlatform()
		// Minecraft's logging config writes logs/ into the working directory; keep it in build/.
		def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
		workingDir = testRunDir
		doFirst { testRunDir.mkdirs() }
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = modJavaVersion
		it.options.encoding = 'UTF-8'
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.toVersion(modJavaVersion)
		targetCompatibility = JavaVersion.toVersion(modJavaVersion)
	}

	// CC BY-SA 4.0 section 3(a)(1)(C) requires the license (or a link to it) to travel with every
	// copy, and 3(a)(1)(A) requires the attribution notices to be retained. Both go into each jar.
	tasks.named('jar') {
		from(rootProject.file('LICENSE')) {
			rename { "LICENSE_${project.mod_id}" }
		}
		from(rootProject.file('NOTICE.md')) {
			rename { "NOTICE_${project.mod_id}.md" }
		}
	}
	tasks.named('sourcesJar') {
		from(rootProject.file('LICENSE')) {
			rename { "LICENSE_${project.mod_id}" }
		}
		from(rootProject.file('NOTICE.md')) {
			rename { "NOTICE_${project.mod_id}.md" }
		}
	}
}

// Convenience: build every loader.
tasks.register('buildAll') {
	group = 'build'
	description = 'Builds the Fabric, NeoForge and Forge jars for Minecraft 1.21.1.'
	dependsOn ':fabric:build', ':neoforge:build', ':forge:build'
}
