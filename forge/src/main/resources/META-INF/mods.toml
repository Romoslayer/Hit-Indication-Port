modLoader = "javafml"
loaderVersion = "[${forgeMajor},)"
license = "CC-BY-SA-4.0"
issueTrackerURL = "https://github.com/Romoslayer/Hit-Indication-Port/issues"

[[mods]]
modId = "hitindication"
version = "${version}"
displayName = "Hit Indication (Port)"
displayURL = "https://github.com/Romoslayer/Hit-Indication-Port"
logoFile = "assets/hitindication/icon.png"
authors = "Hamester and Axovoxel"
credits = "Original mod by Hamester and Axovoxel. Thank you HaHaWTH, Emik, Enitoni, Lily for localizations. Minecraft 1.21.1, 26.2 and 26.3 Fabric, NeoForge and Forge port by Romoslayer."
# Optional on both sides: vanilla clients can join a server with the mod, and a client with it can
# join a server without it.
displayTest = "IGNORE_ALL_VERSION"
description = '''
Adds hit indicators that show where damage is taken from.

Unofficial port of Hamester's Hit Indication (https://github.com/TheHamester/HitIndicator) to Minecraft ${minecraft}. Modified from the original and not affiliated with or endorsed by its authors. Licensed under CC BY-SA 4.0.
'''

[[dependencies.hitindication]]
modId = "forge"
mandatory = true
versionRange = "[${forgeMajor},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hitindication]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "BOTH"
