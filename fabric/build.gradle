plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${archives_base_name}-fabric"
}

repositories {
	// ModMenu + Cloth Config: optional in-game config screen, compile-only.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

loom {
	runs {
		configureEach {
			ideConfigGenerated(true)
			runDir("run")
		}
	}

	mixin {
		useLegacyMixinAp = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.property("mc_${mcKey}_fabric_api")}"

	// Soft dependencies: never required at runtime, never bundled.
	compileOnly "com.terraformersmc:modmenu:${project.property("mc_${mcKey}_modmenu")}"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.property("mc_${mcKey}_cloth_config")}"
}

processResources {
	def version = project.version
	def minecraft = minecraftVersion
	inputs.property 'version', version
	inputs.property 'minecraft', minecraft

	filesMatching('fabric.mod.json') {
		expand 'version': version, 'minecraft': minecraft
	}
}
