plugins {
	// 1.21.1 still ships obfuscated, so this is Loom's remapping variant (with Mojang's names)
	// rather than the plain fabric-loom the 26.x build uses.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "${archives_base_name}-fabric"
}

repositories {
	// ModMenu + Cloth Config: optional in-game config screen, compile-only.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

loom {
	runs {
		configureEach {
			ideConfigGenerated(true)
			runDir("run")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property("mc_${mcKey}_fabric_api")}"

	// Soft dependencies: never required at runtime, never bundled.
	modCompileOnly("com.terraformersmc:modmenu:${project.property("mc_${mcKey}_modmenu")}") {
		transitive = false
	}
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.property("mc_${mcKey}_cloth_config")}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
}

processResources {
	def version = project.version
	def minecraft = minecraftVersion
	inputs.property 'version', version
	inputs.property 'minecraft', minecraft

	filesMatching('fabric.mod.json') {
		expand 'version': version, 'minecraft': minecraft
	}
}
